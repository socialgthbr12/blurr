name: Build APK
on: 
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create Missing Config Files
        run: |
          # Create local.properties
          touch local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "GEMINI_API_KEY=dummy_key" >> local.properties
          echo "BASE_URL=https://generativelanguage.googleapis.com/" >> local.properties
          
          # Create dummy google-services.json
          echo '{
            "project_info": { "project_number": "123", "project_id": "dummy" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:123:android:123", "android_client_info": { "package_name": "com.blurr.voice" } } } ],
            "configuration_version": "1"
          }' > app/google-services.json

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.quietLint=true
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Panda-OpenSource-APK
          path: app/build/outputs/apk/debug/app-debug.apk
